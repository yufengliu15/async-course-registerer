[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "carleton-course-watch"
version = "0.1.0"
description = "ntfy push notifications for public Carleton course availability"
requires-python = ">=3.11"
dependencies = [
  "beautifulsoup4>=4.12,<5",
  "requests>=2.32.4,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
carleton-watch = "carleton_watch:main"

[tool.setuptools]
py-modules = ["carleton_watch"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = ["build", "dist"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
ignore = ["E501"]
